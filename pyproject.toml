[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-for-fools"
version = "0.3.0"
description = "Control experimental del cursor de Windows mediante teclado."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pynput==1.8.2",
]

[project.optional-dependencies]
gui = [
    "PySide6==6.11.2",
]
dev = [
    "PySide6==6.11.2",
    "black>=25.1",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-pynput==1.8.1.20260712",
]

[project.scripts]
mouse-for-fools = "mouse_for_fools.app:main"

[project.gui-scripts]
mouse-for-fools-ui = "mouse_for_fools.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mouse_for_fools = ["legal/*.md", "legal/*.txt"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 96
target-version = ["py311"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mouse_for_fools"]
